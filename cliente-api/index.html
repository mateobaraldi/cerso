<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Gestión de estudiantes</h1>

        <!-- Contenedor para mensajes de éxito o error -->
        <div id="mensaje" class="mensaje oculto" role="alert"></div>

        <!-- Formulario Alta / Edición -->
        <section class="card">
            <h2 id="form-titulo">Nuevo Estudiante</h2>
            <form id="student-form" novalidate>
                <input type="hidden" id="student-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">Nombre *</label>
                        <input type="text" id="firstName" required placeholder="Ej: Ana">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Apellido *</label>
                        <input type="text" id="lastName" required placeholder="Ej: Pérez">
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required placeholder="Ej: ana@mail.com">
                    </div>

                    <div class="form-group">
                        <label for="age">Edad (0 - 120)</label>
                        <input type="number" id="age" min="0" max="120" placeholder="Ej: 20">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Listado y filtro -->
        <section class="card">
            <div class="table-header">
                <h2>Listado de Estudiantes</h2>
                <input type="text" id="buscador" placeholder="Filtrar por apellido...">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-col="id" class="sortable">ID ↕</th>
                            <th data-col="firstName" class="sortable">Nombre ↕</th>
                            <th data-col="lastName" class="sortable">Apellido ↕</th>
                            <th data-col="email" class="sortable">Email ↕</th>
                            <th data-col="age" class="sortable">Edad ↕</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <!-- Filas generadas dinámicamente desde JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
